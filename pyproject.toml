[project]
name = "vrpatch"
version = "0.1.0"
description = "360 video viewport select + AI-clip paste-back"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "typer",
]

[project.optional-dependencies]
web = [
    "starlette",
    "uvicorn",
    "jinja2",
    "pillow",
    "python-multipart",
]
dev = [
    "pytest",
]

[project.scripts]
vrpatch-extract = "vrpatch.cli.extract:app"
vrpatch-merge = "vrpatch.cli.merge:app"
vrpatch-restore = "vrpatch.cli.restore:app"
vrpatch-serve = "vrpatch.cli.serve:app"
vrpatch-pick = "vrpatch.cli.pick:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrpatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
